# SAM 3 数据集配置 (Roboflow COCO 导出格式)
# ==========================================
# 由训练配置通过 data.config 引用, 如:
#   data:
#     config: configs/datasets/roboflow_vl_100.yaml
#
# 数据集布局:
#   <path>/
#     <train>/  ← 图片 + <ann_file>
#     <val>/    ← 图片 + <ann_file>
# COCO categories[].name 即文本 prompt (开放词表检测的训练信号)。
#
# 注意: 数据集注入依赖 Hydra 配置里的标准键 (paths.dataset_root /
# trainer.data.{train,val}.dataset.{img_folder,ann_file}), 请配合模型配置
# configs/models/sam3_image.yaml 使用 (其 hydra: 段含这些键); 直接用后端
# 自带配置 (如 roboflow_v100) 时, 数据路径在那些配置自己的 paths 段里改。

path: <YOUR_DATASET_ROOT>        # 数据集根目录 (绝对路径, 或相对项目根)

train: train                     # 训练集子目录名
val: valid                       # 验证集子目录名 (只有 test/ 就改成 test)
ann_file: _annotations.coco.json # COCO 标注文件名 (Roboflow 导出一般固定)

num_images: null                 # 限制训练图片数 (debug 用); null = 全部
