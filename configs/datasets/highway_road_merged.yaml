# SAM 3 数据集配置: highway_road_merged 高速道路场景分割 (Roboflow COCO 导出格式)
# ============================================================================
# 由 tools/merge_highway_coco_dedup.py 从 highway_road_multi.yaml 的 17 个子
# 数据集合并生成 (6747 train / 1601 valid; 软链接图片, id 全局重映射唯一,
# 已按内容 md5 去重并剔除 train/valid 泄漏, 统计见 <path>/merge_report.json;
# 重新生成: python tools/merge_highway_coco_dedup.py)
# 3 类 (类别名即 SAM3 文本 prompt):
#   highway up direction, highway down direction, road isolation zone
# 注: 类别多为道路区域 (stuff 类) 且带 mask 标注, 分割微调请配合分割训练配方
#     configs/train/example/recipe_image_seg.yaml (见 configs/train/README.md)
#
# 数据集布局:
#   <path>/
#     <train>/  ← 图片 + <ann_file>
#     <val>/    ← 图片 + <ann_file>
# COCO categories[].name 即文本 prompt (开放词表检测的训练信号)。
#
# 注意: 数据集注入依赖 Hydra 配置里的标准键 (paths.dataset_root /
# trainer.data.{train,val}.dataset.{img_folder,ann_file}), 请配合训练配方
# configs/train/example/recipe_image*.yaml 使用 (含这些键); 直接用后端自带配置
# (hydra_config 逃生舱, 如 roboflow_v100) 时键名不同不支持注入, 数据路径
# 在那些配置自己的 paths 段里改。

path: /data2/kaiyun/datasets_seg/highway_road_merged_coco
                                 # 数据集根目录 (绝对路径, 或相对项目根)

train: train                     # 训练集子目录名
val: valid                       # 验证集子目录名 (只有 test/ 就改成 test)
ann_file: _annotations.coco.json # COCO 标注文件名 (Roboflow 导出一般固定)
limit_ratio: 1.0

num_images: null                 # 限制训练图片数 (debug 用); null = 全部
