# SAM 3 模型配置 (图片模型) — 只定义模型构建, 不含训练超参数
# ==============================================================
# 使用方式 (在训练入口配置 configs/train/xxx.yaml 里):
#   model: configs/models/sam3_image.yaml   ← 指向本文件 = 从头训练
#   model: pretrain/sam3/sam3.pt            ← 指向权重 = 预训练微调 (本文件是默认模型配置)
#   model: hf 或不写                         ← HF 自动下载官方权重微调 (gated repo 需 token)
#
# 本文件只有 trainer.model 一段: 模型构建调用。注意本后端的网络结构不在 yaml 里
# —— ViT 主干 / transformer / 检测头都由后端 sam3/sam3/model_builder.py 的
# build_sam3_image_model 代码构建, 所以模型配置能调的只有这几个构建参数
# (enable_segmentation / image_size 等), 改网络结构本身要改后端代码。
#
# 训练超参数 (transforms/loss/优化器/调度器/评测等全部默认值) 在训练模板
# configs/train/template_image.yaml; 每实验常调项旋钮在训练入口 yaml
# (configs/train/custom_finetune.yaml, 清单见 configs/train/README.md)。
#
# 启动训练时前端把本文件的 trainer.model 段文本合并进训练模板, 生成到子模块
# sam3/sam3/train/configs/_custom/ 再传给后端 (生成文件勿手改)。

hydra:
  trainer:
    # 构建参数全集 (后端 build_sam3_image_model 签名, 缺省 = 后端默认):
    #   bpe_path / device / eval_mode / checkpoint_path / load_from_HF /
    #   image_size / enable_segmentation / enable_inst_interactivity / compile
    model:
      _target_: sam3.model_builder.build_sam3_image_model
      bpe_path: ${paths.bpe_path}
      device: cpus            # 在 CPU 上构建, 由 Trainer 搬到 GPU
      eval_mode: false
      enable_segmentation: ${scratch.enable_segmentation}   # ← 模板 scratch 段 (分割训练开关)
      # enable_inst_interactivity: false  # SAM1 交互式 (点/框 prompt) 分支; 开启会多出
      #                                   # inst_interactive_predictor + vision_backbone.sam2_convs
      #                                   # 两块参数; 文本检测/分割训练用不到, 别开
      # compile:                          # torch.compile 模式 (如 "default"); 训练一般不开
      # checkpoint_path / load_from_HF / image_size 由前端 model 字段 / resolution 注入 (++ 前缀)
