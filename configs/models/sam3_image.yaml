# SAM 3 模型网络配置 (图片模型, 训练用)
# ======================================
# 由训练配置 (configs/train/xxx.yaml) 的 model.config 引用:
#   model:
#     config: configs/models/sam3_image.yaml
#
# SAM3 的网络结构不像 YOLO 那样由 YAML 模块化拼装, 结构定义固定在
# Hydra 配置 (hydra_config 指向的模板) 里, 官方默认值已调好, 一般不用动。
# 本文件只暴露最常用的网络相关项; 长尾的网络改动用 overrides 透传。

# 完整 Hydra 训练配置 (网络结构/transforms/loss/优化器定义), 前端视角路径,
# 必须位于 sam3 子模块内:
#   sam3/sam3/train/configs/custom_image_ft.yaml   ← fork 自带的自定义数据微调模板 (推荐)
#   sam3/sam3/train/configs/roboflow_v100/roboflow_v100_full_ft_100_images.yaml  ← 官方参考配置
hydra_config: sam3/sam3/train/configs/custom_image_ft.yaml

pretrained: true        # 预训练权重: true=HF 自动下载 sam3 原版 / 路径=指定 ckpt / false=从零训练
                        # (HF 是 gated repo 需 token, 建议显式指向本地 .pt)
resolution: 1008        # 网络输入分辨率, 必须是 336 的倍数 (336/672/1008/1344...)
                        # RoPE 位置编码按分辨率预计算, 数据 pipeline 会同步改

# ── 网络相关的任意 Hydra 覆盖 (原样透传; 同键时训练配置的 train.overrides 优先) ──
# 例:
# overrides:
#   - trainer.model.enable_segmentation=true   # 开分割分支 (还需模板里 loss 等 3 处联动, 见模板注释)
overrides: []
