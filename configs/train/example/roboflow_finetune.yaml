# SAM 3 训练配置: Roboflow 官方参考配置复现/对照 (hydra_config 逃生舱示例)
# 用法: python sam.py configs/train/roboflow_finetune.yaml
#
# 配置分离模式 (参照 yolo-project):
#   configs/train/xxx.yaml            ← 本文件: 训练入口 (模型/分辨率/数据集/训练旋钮/输出)
#   configs/train/template_image.yaml ← 训练模板: 训练超参数全集 (transforms/loss/优化器
#                                       /调度器/评测/分布式默认值), 与模型配置合并生成后端配置
#   configs/models/xxx.yaml           ← 模型配置 (只定义模型构建; 网络结构在后端代码里)
#   configs/datasets/xxx.yaml         ← 数据集配置 (COCO 格式)
#   configs/export/xxx.yaml           ← ONNX 导出配置 (mode: export, 独立命令)
#
# 约定: 下面列出前端支持的全部字段 (均已核实为后端真实存在的键),
# 默认值与后端一致; 删掉/留空某字段 = 不修改后端, 用后端原值
#
# ─────────────────────────────────────────────────────────────────────────────
# 当前实验: 官方 roboflow_v100 参考配置复现 —— hydra_config 直接指向子模块内
#   官方配置 (上游可能更新, 不平铺拷贝), template 字段被忽略; 不支持
#   configs/datasets/ 注入 (键名不同), 数据集路径在官方配置的 paths 段里改。
#   注意官方配置 submitit.use_cluster 默认 True (本地必须显式 use_cluster: 0),
#   skip_saving_ckpts 默认 true 不存 checkpoint (必须显式 false);
#   freeze 经 ++trainer.freeze 注入, 对官方配置同样生效 (它没有 freeze 键),
#   本例留空 = 全量微调 (官方参考配置即全量)。
# ─────────────────────────────────────────────────────────────────────────────
mode: train

# 模型: 权重 .pt = 预训练微调 (预训练不改网络结构, 默认模型配置 = configs/models/sam3_image.yaml)
#       模型配置 .yaml = 从头训练 / hf 或删掉本行 = HF 自动下载官方权重微调 (gated repo 需 token)
model: pretrain/sam3/sam3.pt

resolution: 1008        # 训练分辨率, 336 的倍数 → scratch.resolution + trainer.model.image_size
                        # (升 1008 更准但更耗显存, 需同步降 batch; 微调产物用于 predict 的
                        #  finetune_ckpt 时, predict yaml 的 image_size 需与此一致)

# 逃生舱: 直接使用子模块内的现成 Hydra 配置 (绕过训练模板+模型配置), 如官方参考配置
hydra_config: sam3/sam3/train/configs/roboflow_v100/roboflow_v100_full_ft_100_images.yaml

# 训练模板: 训练超参数全集 (transforms/loss/优化器等默认值), 一般不用换
#   template_image_seg.yaml = 分割训练 (数据集带 segmentation)
#   template_image.yaml     = 纯检测训练 (无 mask 标注的数据集)
# template: configs/train/template_image.yaml

data:
  config:               # 数据集配置 (独立 YAML)

train:
  # ── 资源 ──
  use_cluster: 0        # 0=本地, 1=SLURM 集群
  num_gpus: 4           # 每节点 GPU 数 (按机器改, 后端默认 1)
  num_nodes: 1          # 节点数
  device:               # 指定用哪几张卡, 如 "0,1,2,3" (CUDA_VISIBLE_DEVICES); 空=全部可见卡
  partition:            # SLURM 分区 (仅 use_cluster: 1)
  account:              # SLURM 账户 (仅 use_cluster: 1)
  qos:                  # SLURM QOS (仅 use_cluster: 1)
  timeout_hour: 72      # 任务时限 → submitit.timeout_hour (仅集群)
  cpus_per_task: 10     # 每任务 CPU 数 → submitit.cpus_per_task (仅集群)

  # ── 参数冻结 ──
  # 真冻结 (requires_grad=False: 不算梯度/不进优化器/DDP 不同步, 比 lr=0 省算力省显存)
  # unix fnmatch pattern 列表, 匹配参数名 → ++trainer.freeze; 留空/删掉 = 不冻结 (全量训练)
  #
  # 全部可冻模块清单 (按参数名前缀, 已对照后端 sam3/sam3/model/ 代码逐一核实;
  # fnmatch 的 * 可跨层级, [0-9] 字符段可用):
  #
  #   ▍主干 (模型的绝大部分参数, 冻结 = 保住预训练通用能力 + 省显存)
  #     backbone.vision_backbone.*               # ViT 图像主干 + 检测 neck 整体
  #       backbone.vision_backbone.trunk.*         # ViT 主体: patch_embed + 32 个 blocks
  #                                                #   (全局注意力在 blocks 7/15/23/31)
  #       backbone.vision_backbone.trunk.blocks.*  # 按层段细选时拆 4 段写:
  #                                                #   blocks.[0-9].* / blocks.1[0-9].* /
  #                                                #   blocks.2[0-9].* / blocks.3[01].*
  #                                                #   如只冻低层两段 (0~19) 放开高层适配
  #                                                #   新域 (配合 lrd 逐层学习率衰减)
  #       backbone.vision_backbone.convs.*         # 检测 FPN neck (ViT 特征 → 多尺度)
  #       (sam2_convs.* 仅交互式构建存在, 本训练链路没有此模块)
  #     backbone.language_backbone.*             # 文本编码器整体 (开放词汇能力的锚,
  #                                              #   几乎所有微调场景都应冻结)
  #       backbone.language_backbone.encoder.*     # TextTransformer 本体 (词嵌入+注意力层)
  #       backbone.language_backbone.resizer.*     # 文本特征 → d_model 投影层; 参数极小,
  #                                                #   想适配自定义 prompt 表述风格可只解冻它
  #
  #   ▍transformer 主体 (微调的主要训练对象; 冻下面这些 = 更激进的省显存方案)
  #     transformer.encoder.*                    # 融合 encoder 6 层 (图像↔文本 cross-attn)
  #       transformer.encoder.layers.*             # encoder 层 (self_attn/cross_attn_image/FFN)
  #     transformer.decoder.*                    # 融合 decoder + 全部检测头
  #       transformer.decoder.layers.*             # decoder 层 (self/cross/ca_text attn + FFN)
  #       transformer.decoder.query_embed.*        # 检测 query 嵌入
  #       transformer.decoder.bbox_embed.*         # 框回归头 (→ cxcywh)
  #       transformer.decoder.presence_token*      # presence token + 头 (图中是否存在该类)
  #       transformer.decoder.ref_point_head.*     # 参考点预测头
  #       transformer.decoder.boxRPB_embed_*.*     # 框相对位置偏置 (boxRPB) 编码
  #       transformer.decoder.reference_points.*   # 参考点嵌入 (box_refine)
  #
  #   ▍任务头 / 其他
  #     segmentation_head.*                      # 分割头; 带 mask 标注训练必须训它, 勿冻
  #     dot_prod_scoring.*                       # 分类打分层 (prompt·query 点积出类别分)
  #     geometry_encoder.*                       # 几何 prompt (box/point/mask) 编码器;
  #                                              #   纯文本 prompt 任务用不到, 冻不冻都行
  #
  # 验证: 训练启动日志会打印 "Freezing N params (patterns: ...), M params remain
  # trainable" 及前 10 个被冻参数名 —— 改完 pattern 先看这行确认生效;
  # pattern 命中全部参数会直接报错 (至少保留 1 个可训参数)
  freeze:

  # ── 优化器 / 学习率 ──
  lr_scale: 0.1              # 学习率缩放 (各组 lr = base × lr_scale) → scratch.lr_scale
  weight_decay: 0.1          # 权重衰减 → scratch.wd
  lrd: 0.9                   # ViT 逐层学习率衰减 → scratch.lrd_vision_backbone
  scheduler_timescale: 20    # 调度器 timescale → scratch.scheduler_timescale
  scheduler_warmup: 20       # 预热步数 → scratch.scheduler_warmup
  scheduler_cooldown: 20     # 冷却步数 → scratch.scheduler_cooldown
  grad_clip: 0.1             # 梯度裁剪范数 → trainer.optim.gradient_clip.max_norm
  amp: true                  # 混合精度开关 → trainer.optim.amp.enabled
  amp_dtype: bfloat16        # 混合精度 dtype → trainer.optim.amp.amp_dtype

  # ── 训练循环 ──
  batch: 1              # 每卡 batch → scratch.train_batch_size (按显存调; 全新训练显存约为冻结主干微调的 2~3 倍)
  epochs: 20            # 训练轮数 → trainer.max_epochs
  grad_accum: 1         # 梯度累积步数 → scratch.gradient_accumulation_steps
  seed: 123             # 随机种子 → trainer.seed_value
  val_freq: 10          # 每隔几轮验证 (>=1; 0 会让后端除零崩溃) → trainer.val_epoch_freq
  skip_first_val: true  # 跳过首轮 (epoch 0) 结束时的验证 → trainer.skip_first_val
  val_batch: 1          # 验证 batch → scratch.val_batch_size
  early_stop: false     # 早停开关 → trainer.early_stop.enabled (按验证次数计)
  early_stop_patience: 5  # 连续 N 次验证无改进即停 → trainer.early_stop.patience

  # ── 验证可视化 (每轮验证结束把验证集 GT/预测拼成马赛克存实验根目录 val_batch*_labels/pred.jpg;
  #    检测框 + mask 半透明叠加, 标签带置信度; 异步渲染不阻塞训练; 只影响出图, 不影响训练与 mAP;
  #    置信度 = 分类×presence; NMS 去重仅可视化用, 后端评测为 query 架构匈牙利匹配无 NMS) ──
  viz_max_files: 3          # 每轮验证出几张马赛克 → trainer.meters.val.custom.viz.max_files
  viz_per_file: 16          # 每张马赛克拼几张验证图 → ...viz.per_file
  viz_score_threshold: 0.1  # 预测置信度阈值 → ...viz.score_threshold
  viz_min_per_img: 3        # 全部低于阈值时仍显示 top-N (训练初期分数低, 防空图) → ...viz.min_per_img
  viz_max_per_img: 5        # 每个 (图, 类别) 最多画几条预测 (防杂乱) → ...viz.max_per_img
  viz_iou_threshold: 0.5    # NMS 去重 IoU 阈值 (仅可视化, 去 query 冗余框; 0=关闭) → ...viz.iou_threshold

  # ── 损失权重 / 匹配器成本 (默认=官方值; 一般不用动, 明确知道问题再调, 如小目标多可抬 loss_giou) ──
  loss_bbox: 5.0        # 框 L1 损失权重 → loss...Boxes.weight_dict.loss_bbox
  loss_giou: 2.0        # 框 GIoU 损失权重 → loss...Boxes.weight_dict.loss_giou
  loss_ce: 20.0         # 分类 BCE 损失权重 → loss...IABCEMdetr.weight_dict.loss_ce
  presence_loss: 20.0   # presence 损失权重 → loss...IABCEMdetr.weight_dict.presence_loss
  pos_weight: 10.0      # 分类正样本 BCE 权重 → loss...IABCEMdetr.pos_weight
  focal_alpha: 0.25     # focal α → loss...IABCEMdetr.alpha
  focal_gamma: 2        # focal γ → loss...IABCEMdetr.gamma
  o2m_weight: 2.0       # one-to-many 辅助分支权重 → loss.o2m_weight
  matcher_cost_class: 2.0  # 匈牙利匹配分类成本 → scratch.matcher.cost_class
  matcher_cost_bbox: 5.0   # 匈牙利匹配 bbox 成本 → scratch.matcher.cost_bbox
  matcher_cost_giou: 2.0   # 匈牙利匹配 GIoU 成本 → scratch.matcher.cost_giou

  # ── 数据加载 ──
  workers: 10           # 训练 dataloader 进程数 → scratch.num_train_workers (Windows 建议 0)
  val_workers: 0        # 验证 dataloader 进程数 → scratch.num_val_workers
  max_ann_per_img: 200  # 单图最多标注数 (超出过滤) → scratch.max_ann_per_img

  # ── 记录 / 保存 ──
  save_freq: 0          # checkpoint 保存频率, 0=只存最后一个 → trainer.checkpoint.save_freq
  log_freq: 10          # 日志打印频率 (step) → trainer.logging.log_freq
  skip_saving_ckpts: false  # 是否不存 checkpoint → trainer.skip_saving_ckpts (微调必须 false)

output:
  path: runs/train/roboflow_ft    # 实验输出目录 (checkpoints/tensorboard/logs) → paths.experiment_log_dir
