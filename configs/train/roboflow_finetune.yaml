# SAM 3 训练配置 (Roboflow 官方参考配置复现/对照)
# 用法: python sam.py configs/train/roboflow_finetune.yaml
#
# 注意: hydra_config 直接指向子模块内官方参考配置 (上游可能更新, 不平铺拷贝),
# 数据集路径在该配置的 paths 段里改, 不支持 configs/datasets/ 注入 (键名不同)
#
# 约定: 下面列出前端支持的全部字段 (均已核实为后端真实存在的键),
# 默认值与官方参考配置一致; 删掉/留空某字段 = 不修改后端, 用后端原值
mode: train

# 模型: 权重 .pt = 预训练微调 / hf 或删掉 = HF 下载官方权重 / 模型配置 .yaml = 从头训练
model: pretrain/sam3/sam3.pt

# 逃生舱: 直接使用子模块内官方参考配置 (绕过训练模板 template_image.yaml + 默认模型配置)
hydra_config: sam3/sam3/train/configs/roboflow_v100/roboflow_v100_full_ft_100_images.yaml

resolution: 1008        # 训练分辨率, 336 的倍数

data:
  config:               # 数据集配置 (独立 YAML); 本例用官方参考配置时不支持, 留空

train:
  # ── 资源 ──
  use_cluster: 0        # 0=本地, 1=SLURM 集群 (官方参考配置默认 1, 本地必须显式设 0)
  num_gpus: 4           # 每节点 GPU 数 (按机器改)
  num_nodes: 1          # 节点数
  device:               # 指定用哪几张卡, 如 "0,1,2,3"; 空=全部可见卡
  partition:            # SLURM 分区 (仅 use_cluster: 1)
  account:              # SLURM 账户 (仅 use_cluster: 1)
  qos:                  # SLURM QOS (仅 use_cluster: 1)
  timeout_hour: 72      # 任务时限 → submitit.timeout_hour (仅集群)
  cpus_per_task: 10     # 每任务 CPU 数 → submitit.cpus_per_task (仅集群)

  # ── 优化器 / 学习率 ──
  lr_scale: 0.1              # → scratch.lr_scale
  weight_decay: 0.1          # → scratch.wd
  lrd: 0.9                   # → scratch.lrd_vision_backbone
  scheduler_timescale: 20    # → scratch.scheduler_timescale
  scheduler_warmup: 20       # → scratch.scheduler_warmup
  scheduler_cooldown: 20     # → scratch.scheduler_cooldown
  grad_clip: 0.1             # → trainer.optim.gradient_clip.max_norm
  amp: true                  # → trainer.optim.amp.enabled
  amp_dtype: bfloat16        # → trainer.optim.amp.amp_dtype

  # ── 训练循环 ──
  batch: 1              # → scratch.train_batch_size
  epochs: 20            # → trainer.max_epochs
  grad_accum: 1         # → scratch.gradient_accumulation_steps
  seed: 123             # → trainer.seed_value
  val_freq: 10          # → trainer.val_epoch_freq
  skip_first_val: true  # → trainer.skip_first_val
  val_batch: 1          # → scratch.val_batch_size
  early_stop: false     # 早停开关 → trainer.early_stop.enabled (按验证次数计)
  early_stop_patience: 5  # → trainer.early_stop.patience

  # ── 损失权重 / 匹配器成本 (默认=官方值; 一般不用动, 明确知道问题再调) ──
  loss_bbox: 5.0        # 框 L1 损失权重
  loss_giou: 2.0        # 框 GIoU 损失权重 (小目标多可适当抬高)
  loss_ce: 20.0         # 分类 BCE 损失权重
  presence_loss: 20.0   # presence 损失权重
  pos_weight: 10.0      # 分类正样本 BCE 权重
  focal_alpha: 0.25     # focal α
  focal_gamma: 2        # focal γ
  o2m_weight: 2.0       # one-to-many 辅助分支权重
  matcher_cost_class: 2.0  # 匈牙利匹配分类成本 → scratch.matcher.cost_class
  matcher_cost_bbox: 5.0   # 匈牙利匹配 bbox 成本
  matcher_cost_giou: 2.0   # 匈牙利匹配 GIoU 成本

  # ── 数据加载 ──
  workers: 10           # → scratch.num_train_workers
  val_workers: 0        # → scratch.num_val_workers
  max_ann_per_img: 200  # → scratch.max_ann_per_img

  # ── 记录 / 保存 ──
  save_freq: 0          # → trainer.checkpoint.save_freq (0=只存最后一个)
  log_freq: 10          # → trainer.logging.log_freq
  skip_saving_ckpts: false  # → trainer.skip_saving_ckpts (官方参考配置默认 true 不存 checkpoint, 必须显式 false)

output:
  path: runs/train/roboflow_ft    # 实验输出目录 → paths.experiment_log_dir
