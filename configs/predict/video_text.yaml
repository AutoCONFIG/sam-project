# SAM 3.1 视频推理配置 — 文本提示
# ===================================
# 用文本提示在视频中检测、分割并跟踪指定类别的对象

mode: predict

model:
  checkpoint: /media/yun/706bc403-c76c-4fdd-8a3f-d954b6189048/sam3/sam3.1/sam3.1_multiplex.pt
  image_size: 1008              # 推理分辨率, 须为 336 的倍数 (14*24); 16G 显存用 672
  use_fa3: false                # Flash Attention 3 (需安装 flash-attn, 默认 false)
  use_rope_real: true           # 实数 RoPE (避免 complex64 buffer, 默认 true)
  compile: false                # torch.compile (首次慢, 默认 false)
  frame_index: 0                # 添加提示的帧索引

io:
  input: /media/yun/706bc403-c76c-4fdd-8a3f-d954b6189048/sam3/assets/videos/bedroom.mp4
  output: runs/predict/test     # 输出目录
  save_vis: true                # 保存可视化叠加图
  save_masks: true              # 保存 mask npz (label_map + meta)
  save_video: false             # 把 vis 合成 mp4

prompt:
  text: "person"                # 文本提示, 如 "person", "a player in white", "dog"
