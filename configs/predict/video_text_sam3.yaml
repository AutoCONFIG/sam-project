# SAM 3 原版推理配置 — 文本提示 (sam3, 非 multiplex)
# ==================================================
# 用 SAM 3 原版权重推理。注意:
#   - sam3 原版的 image_size 后端固定 1008, 不支持参数化 (需 ≥24GB 显存),
#     本配置勿改 image_size; 16GB 显卡跑不了, 请用 video_text.yaml (sam3.1)
#   - max_num_objects / multiplex_count / compile 仅 sam3.1 支持, 本配置中无效
#
# 字段与注释模板与 video_text.yaml 完全一致;
# 删掉/留空某字段 = 用代码默认值, 与写默认值等价。
#
# 用法: python sam.py configs/predict/video_text_sam3.yaml

mode: predict

model:
  version: sam3                     # 模型版本: sam3.1 (multiplex, 推荐) / sam3 (原版)
  checkpoint: /media/yun/706bc403-c76c-4fdd-8a3f-d954b6189048/sam-project/pretrain/sam3/sam3.pt
                                    # 权重路径 (sam3.1_multiplex.pt 或 sam3.pt), 必填
  finetune_ckpt:                    # 微调权重 (训练链产出 runs/train/.../checkpoints/checkpoint.pt;
                                    # 仅 sam3.1, 加载进 detector, checkpoint 仍提供 tracker 等基础权重;
                                    # 注意训练 resolution 需与 image_size 一致), 空=纯预训练 (默认)
  image_size: 1008                  # 推理分辨率, 须为 336 的倍数; ≥24G 显存 1008, 16G 用 672
                                    # (仅 sam3.1 支持; sam3 原版后端固定 1008)
  max_num_objects: 16               # 单 session 最多同时跟踪对象数, 超出丢弃并告警
                                    # (仅 sam3.1; 运行时上限, 多目标场景可自由调大, 显存随之涨)
  multiplex_count: 16               # 每个 multiplex 桶的对象容量 (仅 sam3.1)
                                    # ⚠ 结构参数: 已固化进 checkpoint 权重形状 (预训练=16),
                                    # 改它会与预训练权重 size mismatch 崩溃; 仅从头自训模型时可改
  use_fa3: false                    # Flash Attention 3 (需安装 flash-attn, 仅 Hopper 系 GPU)
  use_rope_real: true               # 实数 RoPE (避免 complex64 buffer)
  compile: false                    # torch.compile (首次编译慢, 之后推理约 2x; 仅 sam3.1)
  frame_index: 0                    # 添加文本提示的帧索引

io:
  input: /media/yun/706bc403-c76c-4fdd-8a3f-d954b6189048/sam-project/sam3/assets/videos/bedroom.mp4
                                    # 输入: 视频文件 / 图片目录 (递归扫描, 必填)
  output: runs/predict/test_sam3    # 输出根目录
  save_vis: true                    # 保存可视化 (视频→mp4, 图片→jpg; 按类别着色+检测框+图例+置信度)
  save_masks: true                  # 保存 mask (视频→mp4, 图片→png) + npz 原始数据
  save_video: true                  # 视频输入时合成 mp4 (图片输入忽略)
  save_labels: true                 # 导出标签
  label_format: [coco, yolo]        # 标签格式: coco / yolo, 可多选
  image_mode: sequence              # 图片目录处理: independent=每张独立检测 (默认, 适合各自
                                    # 不同场景的图片集); sequence=第 0 帧检测后跨帧传播跟踪
                                    # (适合视频抽帧序列); 视频文件输入忽略此字段

# ─────────────────────────────────────────────────────────────────────
# prompt.text 类别写法 (始终用列表):
#
#   单类别:
#     text: ["person"]
#
#   多类别:
#     text:
#       - person
#       - bed
#       - car
#
# SAM3 架构不支持一次推理检测多个不同类别 (每次 text prompt 都会 reset
# session), 所以多类别只能逐类别各跑一遍推理后合并结果。代码已优化:
# 复用同一个 session (帧只加载一次), 逐类别 reset + 推理, 避免重复写帧/
# 读帧开销。但 backbone 特征每类别仍需重算 (reset 会清缓存), 这是架构
# 固有, 无法避免。多类别耗时约为 N 类别 × 单类别时间。
#
# 兼容: 字符串 (如 text: "person") 会被自动转单元素列表, 但推荐列表写法。
# ─────────────────────────────────────────────────────────────────────

# ── 检测后处理阈值 (原后端硬编码, 现可调; 不写 = 用版本默认值) ──
predict:
  score_threshold_detection: 0.5  # 检测置信度阈值 (sam3.1 默认 0.4, sam3 默认 0.5; 调低→更多检测, 调高→更精准)
  det_nms_thresh: 0.1             # 检测 NMS IoU 阈值 (调高→保留更多重叠框, 调低→去重更激进)
  new_det_thresh: 0.7             # 新对象确认阈值 (跟踪中新增对象需达此分数; 调低→更容易新增, 调高→更保守)

prompt:
  text: ["person"]                  # 文本提示类别列表, 必填; 多类别加列表项 (见上方注释)
